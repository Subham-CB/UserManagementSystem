# Development Profile - H2 In-Memory Database

# Database Configuration - H2
spring.datasource.url=jdbc:h2:mem:customers_db;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA/Hibernate Configuration for H2
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.defer-datasource-initialization=true

# Logging
logging.level.com.userdashoard.userdashboard=DEBUG

# Optional: LocalStack S3 for profile images when running locally (start LocalStack first)
