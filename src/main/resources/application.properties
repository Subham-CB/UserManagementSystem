spring.application.name=userdashboard
server.port = 8080

# Database Configuration - PostgresSQL (Production/Docker)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/Users_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Security Configuration
spring.security.filter.order=10

# AWS Configuration
aws.region=${AWS_REGION:us-east-1}
aws.endpoint-override=${AWS_ENDPOINT_OVERRIDE:http://localhost:4566}
aws.access-key-id=${AWS_ACCESS_KEY_ID:test}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:test}

springdoc.swagger-ui.path=/docs

# Multipart (profile image upload)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# LocalStack / S3 (profile images) - override in Docker with env
app.s3.bucket-name=userdashboard-profiles
app.s3.region=us-east-1
app.s3.endpoint-override= ${AWS_ENDPOINT_OVERRIDE:http://localhost:4566}
app.s3.public-base-url= http://localhost:4566/userdashboard-profiles

#Disable the SDK v1 Deprecation Warning
aws.java.v1.disableDeprecationAnnouncement=true



