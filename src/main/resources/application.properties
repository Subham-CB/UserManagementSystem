spring.application.name=userdashboard
server.port = 8080

# Database Configuration - PostgresSQL (Production/Docker)
spring.datasource.url=jdbc:postgresql://localhost:5432/Users_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Security Configuration
spring.security.filter.order=10

springdoc.swagger-ui.path=/docs

# Multipart (profile image upload)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# LocalStack / S3 (profile images) - override in Docker with env
app.s3.bucket-name=userdashboard-profiles
app.s3.region=us-east-1
# Leave empty for real AWS; set to http://localhost:4566 for LocalStack (host) or http://localstack:4566 (Docker)
app.s3.endpoint-override=
# URL used in HTML for img src (e.g. http://localhost:4566/userdashboard-profiles when using LocalStack)
app.s3.public-base-url=


